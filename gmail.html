<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تطبيق المسجد - وادي سوف</title>
    <style>
        :root {
            --soft-white: #ffffff; 
            --accent-gold: #f1c40f; 
            --dark-bg: rgba(0, 0, 0, 0.85); 
            --card-bg: rgba(255, 255, 255, 0.05);                
        }

        body {
            background-image: linear-gradient(var(--dark-bg), var(--dark-bg)), 
                              url('https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?w=1920');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--soft-white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* تنسيق عام للبند الشفاف */
        .glass-box {
            position: absolute;
            top: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* البند الشفاف للوقت والتاريخ (يمين) */
        .time-date-box {
            right: 20px;
            text-align: left;
        }

        .digital-time {
            font-size: 2.5rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* البند الشفاف للعد التنازلي (يسار) */
        .countdown-box {
            left: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 140px;
            height: 100px;
            border: 2px solid var(--accent-gold);
            background: rgba(0,0,0,0.5);
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.2);
        }

        .countdown-label {
            font-size: 0.75rem;
            color: var(--soft-white);
            text-transform: uppercase;
        }

        .countdown-timer {
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        .next-prayer-name {
            font-size: 0.9rem;
            color: var(--accent-gold);
            font-weight: bold;
        }

        /* الأحاديث - توسيط في الشاشة */
        .hadith-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 10%;
        }

        #hadith-text {
            font-size: 2.2rem;
            color: white;
            line-height: 1.6;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.9);
            font-weight: 500;
            transition: opacity 0.8s ease-in-out;
            background: rgba(0,0,0,0.4);
            padding: 20px;
            border-radius: 15px;
        }

        /* المواقيت */
        .prayers-row {
            display: flex;
            justify-content: space-evenly;
            padding: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            border-top: 2px solid var(--accent-gold);
        }

        .prayer-card {
            text-align: center;
            min-width: 110px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        .prayer-name {
            font-size: 1.5rem;
            color: var(--accent-gold);
            margin-bottom: 5px;
            font-weight: bold;
        }

        .prayer-time {
            font-size: 2rem;
            font-weight: bold;
            color: white;
            margin-bottom: 5px;
        }

        .iqama-small {
            font-size: 0.85rem;
            color: #ddd;
            background: rgba(0,0,0,0.3);
            padding: 3px 10px;
            border-radius: 10px;
        }

        /* كلاس الوقت الماضي */
        .past { 
            opacity: 0.3; 
            filter: grayscale(80%);
        }

        /* تأثير نبض للوقت الحالي */
        .active-prayer {
            border: 1px solid var(--accent-gold);
            box-shadow: 0 0 10px rgba(197, 160, 89, 0.5);
            background: rgba(197, 160, 89, 0.1);
        }
    </style>
</head>
<body>

    <div class="glass-box time-date-box">
        <div class="digital-time" id="digital-clock">00:00:00</div>
        <div style="color: var(--accent-gold); font-size: 1rem; font-weight: bold;" id="hijri-date">---</div>
        <div style="font-size: 0.9rem; color: #fff;" id="gregorian-date">---</div>
    </div>

    <div class="glass-box countdown-box">
        <div class="countdown-label">باقي على</div>
        <div class="next-prayer-name" id="next-prayer-name">--</div>
        <div class="countdown-timer" id="countdown-timer">00:00</div>
    </div>

    <div class="hadith-section">
        <div id="hadith-text">جاري تحميل الأحاديث...</div>
    </div>

    <div class="prayers-row" id="prayers-container"></div>

    <script>
        // --- ⚠️ إعدادات الموقع المرجعي (وادي سوف) ⚠️ ---
        // تم استخدام إحداثيات دقيقة لوادي سوف
        const latitude = 33.37;  // خط العرض
        const longitude = 6.83;  // خط الطول
        const method = 3;        // 3: رابطة العالم الإسلامي (أدق للجزائر)
        // ----------------------------------------

        const ahadith = [
            "\"قَالَ ﷺ: الصَّلَاةُ نُورٌ\"",
            "\"قَالَ ﷺ: خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ\"",
            "\"قَالَ ﷺ: مَنْ صَلَّى الْبَرْدَيْنِ دَخَلَ الْجَنَّةَ\"",
            "\"قَالَ ﷺ: أَقْرَبُ ما يَكونُ العَبْدُ مِن رَبِّهِ وهو ساجِدٌ\""
        ];
        let hIndex = 0;
        let prayerData = [];
        let currentDateString = "";

        async function getPrayerTimes() {
            try {
                const now = new Date();
                const day = now.getDate();
                const month = now.getMonth() + 1;
                const year = now.getFullYear();
                const newDateString = `${day}-${month}-${year}`;

                if (newDateString !== currentDateString) {
                    currentDateString = newDateString;
                    // جلب البيانات بناءً على الموقع الدقيق وطريقة الحساب
                    const response = await fetch(`https://api.aladhan.com/v1/timings/${currentDateString}?latitude=${latitude}&longitude=${longitude}&method=${method}`);
                    const data = await response.json();
                    const timings = data.data.timings;
                    const date = data.data.date;

                    document.getElementById('hijri-date').innerText = `${date.hijri.day} ${date.hijri.month.ar} ${date.hijri.year}`;
                    document.getElementById('gregorian-date').innerText = `${date.gregorian.weekday.ar}، ${date.gregorian.date}`;

                    prayerData = [
                        { name: "الفجر", time: timings.Fajr, iqama: "20" },
                        { name: "الظهر", time: timings.Dhuhr, iqama: "15" },
                        { name: "العصر", time: timings.Asr, iqama: "15" },
                        { name: "المغرب", time: timings.Maghrib, iqama: "10" },
                        { name: "العشاء", time: timings.Isha, iqama: "15" }
                    ];
                }
                updateUI();
            } catch (error) {
                console.error("خطأ:", error);
            }
        }

        function updateUI() {
            if (prayerData.length === 0) return;
            const now = new Date();
            const h = now.getHours();
            const m = now.getMinutes();
            const s = now.getSeconds();
            const nowM = h * 60 + m;

            document.getElementById('digital-clock').innerText = 
                `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;

            let nextPrayer = null;
            let timeDiff = 0;

            for (let i = 0; i < prayerData.length; i++) {
                const [pH, pM] = prayerData[i].time.split(':').map(Number);
                const pMins = pH * 60 + pM;
                if (nowM < pMins) {
                    nextPrayer = prayerData[i];
                    timeDiff = pMins - nowM;
                    break;
                }
            }

            if (!nextPrayer) {
                const [pH, pM] = prayerData[0].time.split(':').map(Number);
                const pMins = pH * 60 + pM;
                nextPrayer = prayerData[0];
                timeDiff = (1440 - nowM) + pMins;
            }

            const hoursLeft = Math.floor((timeDiff * 60 - s) / 3600);
            const minsLeft = Math.floor(((timeDiff * 60 - s) % 3600) / 60);
            const secsLeft = Math.floor((timeDiff * 60 - s) % 60);

            let countdownStr = hoursLeft > 0 ? 
                `${hoursLeft.toString().padStart(2,'0')}:${minsLeft.toString().padStart(2,'0')}` :
                `${minsLeft.toString().padStart(2,'0')}:${secsLeft.toString().padStart(2,'0')}`;
            
            document.getElementById('next-prayer-name').innerText = nextPrayer.name;
            document.getElementById('countdown-timer').innerText = countdownStr;

            const [eshH, eshM] = prayerData[4].time.split(':').map(Number);
            const eshMins = eshH * 60 + eshM;
            const dayEnded = (nowM > eshMins + 45) || (h < 4);

            let html = '';
            prayerData.forEach((p) => {
                const [pH, pM] = p.time.split(':').map(Number);
                const pMins = pH * 60 + pM;
                let status = '';
                if (!dayEnded) {
                    if (nowM > pMins + 30) status = 'past';
                    else if (nowM >= pMins && nowM <= pMins + 30) status = 'active-prayer';
                }
                html += `<div class="prayer-card ${status}">
                            <div class="prayer-name">${p.name}</div>
                            <div class="prayer-time">${p.time}</div>
                            <div class="iqama-small">الإقامة ${p.iqama} د</div>
                         </div>`;
            });
            document.getElementById('prayers-container').innerHTML = html;
        }

        setInterval(() => {
            hIndex = (hIndex + 1) % ahadith.length;
            const el = document.getElementById('hadith-text');
            el.style.opacity = 0;
            setTimeout(() => {
                el.innerText = ahadith[hIndex];
                el.style.opacity = 1;
            }, 800);
        }, 15000);

        getPrayerTimes();
        setInterval(getPrayerTimes, 60000);
        setInterval(updateUI, 1000);
    </script>
</body>
</html>
